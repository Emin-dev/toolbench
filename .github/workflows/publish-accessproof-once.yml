name: One-time exact AccessProof publication
on:
  push:
    branches: [consolidation/publish-accessproof-e854510]
permissions: {}
concurrency:
  group: publish-accessproof-e854510
  cancel-in-progress: false
jobs:
  publish-preserved-history:
    if: github.repository == 'Emin-dev/toolbench' && github.event_name == 'push' && github.ref == 'refs/heads/consolidation/publish-accessproof-e854510'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish exact absent review branch and remove unchanged temporary branch
        run: python3 .consolidation/publish_accessproof.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
